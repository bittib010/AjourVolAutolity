name: 'CI'

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tofu:
    name: 'OpenTofu fmt/validate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~> 1.12"
          tofu_wrapper: false
      - run: tofu fmt -check -recursive cfg
      - run: tofu -chdir=cfg init -backend=false -input=false
      - run: tofu -chdir=cfg validate
      - run: tofu -chdir=cfg/bootstrap init -backend=false -input=false
      - run: tofu -chdir=cfg/bootstrap validate

  python:
    name: 'Python tests'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VolAutolity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Ubuntu 24.04's python3, as on the worker VM
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  workbook:
    name: 'Workbook build + KQL validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python workbook/build.py --check
      - run: npm ci --ignore-scripts
        working-directory: workbook/validate
      - run: python workbook/build.py --export-queries "$RUNNER_TEMP/queries.json"
      - run: node workbook/validate/check.js "$RUNNER_TEMP/queries.json" VolAutolity/volautolity/schemas.json

  shell:
    name: 'shellcheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck VolAutolity/deploy/setup.sh
